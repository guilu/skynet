[versions]
spring-boot = "4.1.1"
spring-modulith = "2.1.1"
spotless = "8.9.0"
# 1.37 falla dentro de Spotless con JDK 21 (InvocationTargetException); revisar al subir de JDK.
google-java-format = "1.28.0"
sqlite-jdbc = "3.53.4.0"

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "spring-modulith" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }

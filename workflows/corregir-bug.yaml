id: corregir-bug
name: Corregir un bug
description: Reproduce el fallo con un test, lo corrige con los tests en verde y busca regresiones antes de abrir la PR. Si no se consigue reproducir, te pregunta antes de seguir.

agents:
  reproductor:
    description: Reproduce el bug con un test que falla, sin corregirlo.
    provider: codex
    model: ${CODEX_FUERTE}
    fallback:
      provider: claude-code
      model: ${CLAUDE_FUERTE}
    permissionMode: acceptEdits
    prompt: |
      Reproduce el bug de {{workItem.key}}: {{workItem.title}}.

      {{workItem.description}}

      Si existe docs/skynet/mapa-{{project.slug}}.md (el mapa del repositorio que deja «Conocer un repositorio»), léelo primero.
      Escribe un test automático que falle por culpa del bug y ejecútalo para comprobarlo. No corrijas el bug.
      Devuelve si lo has reproducido, la ruta del test y la causa más probable.
    output:
      type: object
      properties:
        reproduced: {type: boolean}
        test: {type: string}
        cause: {type: string}
  desarrollador:
    description: Corrige el bug y deja los tests en verde.
    model: ${CLAUDE_GENERAL}
    fallback:
      provider: codex
      model: ${CODEX_FUERTE}
    permissionMode: acceptEdits
  # El juez de `juzgar` (VA-B, VA-C): en solo lectura, con la rúbrica y sin ver lo que dijo el
  # desarrollador. Su reserva nunca es Claude Code, que es quien corrige.
  vigia:
    description: Juez que busca regresiones.
    provider: antigravity
    model: ${AGY_RAPIDO}
    fallback:
      provider: codex
      model: ${CODEX_RAPIDO}
    prompt: |
      Busca regresiones: otros sitios que usen lo que ha cambiado y casos que el test no cubre.

stages:
  - id: reproducir
    name: Reproduce el fallo con un test
    type: agent
    agent: reproductor
    phase: test
  # Si no se pudo reproducir, una persona decide si se sigue (o lo descarta). Si se reprodujo,
  # la puerta se omite y corregir sigue sin esperar.
  - id: sin-reproducir
    name: Decides si seguir sin reproducirlo
    type: human-approval
    dependsOn: [reproducir]
    phase: test
    condition: "!reproducir.reproduced"
    action: "No se ha podido reproducir {{workItem.key}} ({{stages.reproducir.output.cause}}): ¿sigo con la corrección?"
    risk: medium
  - id: corregir
    name: Corrige el bug
    type: agent
    agent: desarrollador
    dependsOn: [reproducir, "sin-reproducir?"]
    workspaceFrom: reproducir
    phase: implement
    prompt: |
      Corrige el bug de {{workItem.key}}: {{workItem.title}}.

      {{workItem.description}}

      Reproducción (Codex): ¿reproducido? {{stages.reproducir.output.reproduced}}. Test: {{stages.reproducir.output.test}}.
      Causa probable: {{stages.reproducir.output.cause}}

      Si no hay test que lo reproduzca, escribe uno primero. Corrige la causa, no el síntoma, deja todos los tests en verde y confirma los cambios con un commit.
    checks: [tests, diff]
  # Antigravity juzga la corrección con la rúbrica. Cada hallazgo que bloquea pasa por dos
  # escépticos que intentan refutarlo; lo que sobrevive lo arregla corregir en su sesión, y se
  # vuelve a juzgar (como mucho 2 rondas).
  - id: juzgar
    name: Busca regresiones
    type: verification
    dependsOn: [corregir]
    phase: review
    judge:
      agents:
        - {agent: vigia, lens: correctness}
      rubric:
        - {id: resuelve, text: "Corrige la causa del bug, no solo el síntoma", weight: 3, required: true}
        - {id: reproduce, text: "Hay un test que fallaba con el bug y ahora pasa", weight: 2, required: true}
        - {id: regresiones, text: "No rompe otros usos de lo que ha cambiado", weight: 2}
      refute: 2
      # AU-C: un cambio de solo documentación pasa sin juez; los escépticos, solo en el nivel 2.
      minRisk: 1
      refuteMinRisk: 2
    fix: corregir
  # Entrega por PR (EN): en un repositorio con la GitHub App sube la rama, abre la PR, espera la CI
  # (si falla, la corrige corregir), pide aprobar la fusión y fusiona. En uno local, se omiten.
  - id: pr
    name: Abre la PR
    type: github-pr
    dependsOn: [juzgar]
    phase: deliver
    condition: repository.github
  - id: ci
    name: Espera la CI
    type: github-check
    dependsOn: [pr]
    phase: deliver
    condition: repository.github
    fix: corregir
  - id: aprobar-fusion
    name: Apruebas fusionar
    type: human-approval
    dependsOn: [ci]
    phase: deliver
    condition: repository.github
    action: "Fusionar la PR de {{workItem.key}}: {{workItem.title}}"
    risk: high
    # AU-C: se aprueba sola si el repositorio lo permite y el cambio es de riesgo 0-1, de 400
    # líneas como mucho, con la CI en verde y juzgado.
    autoApprove: {maxRisk: 1, maxLines: 400}
  - id: fusionar
    name: Fusiona la PR
    type: github-merge
    dependsOn: [aprobar-fusion]
    phase: deliver
    condition: repository.github

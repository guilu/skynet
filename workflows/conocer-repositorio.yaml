id: conocer-repositorio
name: Conocer un repositorio
description: Para empezar con un proyecto nuevo. Averigua cómo se compila y se prueba, y deja un mapa del repositorio en docs/skynet/mapa-<clave>.md para quien trabaje en él después.

agents:
  comandos:
    description: Averigua cómo se compila y se prueba el repositorio, sin cambiar nada.
    provider: codex
    model: ${CODEX_RAPIDO}
    fallback:
      provider: claude-code
      model: ${CLAUDE_RAPIDO}
    permissionMode: acceptEdits
    prompt: |
      Averigua cómo se compila este repositorio y cómo se pasan sus tests, y compruébalo ejecutándolos. No cambies ningún fichero del repositorio.
      Devuelve el comando de compilar, el de los tests (el que pondrías como comando de verificación en Skynet), si los tests pasan y lo que haga falta saber (versiones, variables, servicios).
    output:
      type: object
      properties:
        buildCommand: {type: string}
        testCommand: {type: string}
        testsPass: {type: boolean}
        notes: {type: string}
  cartografo:
    description: Escribe el mapa del repositorio.
    provider: antigravity
    model: ${AGY_FUERTE}
    fallback:
      provider: claude-code
      model: ${CLAUDE_FUERTE}
    permissionMode: acceptEdits

stages:
  - id: comandos
    name: Averigua cómo se compila y se prueba
    type: agent
    agent: comandos
    phase: test
  - id: mapa
    name: Escribe el mapa del repositorio
    type: agent
    agent: cartografo
    dependsOn: [comandos]
    phase: deliver
    prompt: |
      Lee el repositorio entero y escribe docs/skynet/mapa-{{project.slug}}.md (proyecto {{project.name}}), pensado para quien (persona o agente) vaya a trabajar en él por primera vez:
      - qué es y para qué sirve;
      - módulos y carpetas, con lo que hace cada uno y cómo se relacionan;
      - el flujo principal de punta a punta;
      - convenciones (estilo, tests, nombres, commits);
      - dónde tocar para los cambios más habituales;
      - riesgos y deuda técnica que veas.

      Para compilar: {{stages.comandos.output.buildCommand}}
      Para los tests: {{stages.comandos.output.testCommand}} (¿pasan? {{stages.comandos.output.testsPass}})
      Notas: {{stages.comandos.output.notes}}

      Cambia solo ese fichero y confírmalo con un commit.
    artifacts: [docs/skynet/mapa-*.md]
    # El mapa tiene que llegar a la rama por defecto: los demás workflows lo buscan ahí.
    checks: [commit]
  # Entrega por PR (EN): en un repositorio con la GitHub App sube la rama, abre la PR, espera la CI
  # (si falla, la corrige mapa), pide aprobar la fusión y fusiona. En uno local, se omiten.
  - id: pr
    name: Abre la PR
    type: github-pr
    dependsOn: [mapa]
    phase: deliver
    condition: repository.github
  - id: ci
    name: Espera la CI
    type: github-check
    dependsOn: [pr]
    phase: deliver
    condition: repository.github
    fix: mapa
  - id: aprobar-fusion
    name: Apruebas fusionar
    type: human-approval
    dependsOn: [ci]
    phase: deliver
    condition: repository.github
    action: "Fusionar el mapa del repositorio de {{project.name}}"
    risk: low
  - id: fusionar
    name: Fusiona la PR
    type: github-merge
    dependsOn: [aprobar-fusion]
    phase: deliver
    condition: repository.github

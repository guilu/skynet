id: implementar-tarea
name: Implementar una tarea
description: Antigravity explora el repositorio, Claude Code implementa con los tests en verde, Codex y Antigravity lo juzgan a la vez con una rúbrica, los escépticos descartan los falsos positivos y Claude Code corrige solo lo que bloquea de verdad.

agents:
  explorador:
    provider: antigravity
    model: ${AGY_RAPIDO}
    fallback:
      provider: claude-code
      model: ${CLAUDE_RAPIDO}
    permissionMode: plan
    prompt: |
      Antes de implementar {{workItem.key}} ({{workItem.title}}), explora el repositorio y prepara el terreno.

      {{workItem.description}}

      Si existe docs/skynet/mapa-{{project.slug}}.md (el mapa del repositorio que deja «Conocer un repositorio»), léelo primero.
      No cambies nada. Devuelve un resumen de cómo está organizado lo que toca la tarea, los ficheros que habrá que cambiar y los riesgos.
  desarrollador:
    model: ${CLAUDE_GENERAL}
    fallback:
      provider: codex
      model: ${CODEX_FUERTE}
    permissionMode: acceptEdits
    prompt: |
      Implementa {{workItem.key}}: {{workItem.title}}.

      {{workItem.description}}

      Sigue las convenciones del repositorio, añade o ajusta los tests y confirma los cambios con un commit.
  # Los jueces de `juzgar` (VA-B, VA-C): en solo lectura, con la rúbrica que escribe Skynet y sin
  # ver lo que dijo el desarrollador. Su reserva nunca es Claude Code, que es quien implementa.
  calidad:
    provider: codex
    model: ${CODEX_FUERTE}
    fallback:
      provider: antigravity
      model: ${AGY_FUERTE}
    prompt: |
      Fíjate sobre todo en la corrección, los tests y los casos límite.
  seguridad:
    provider: antigravity
    model: ${AGY_FUERTE}
    fallback:
      provider: codex
      model: ${CODEX_FUERTE}
    prompt: |
      Fíjate sobre todo en las entradas, los secretos, los permisos y las dependencias.

stages:
  - id: explorar
    type: agent
    agent: explorador
    phase: spec
    outputSchema:
      type: object
      properties:
        summary: {type: string}
        files: {type: array, items: {type: string}}
        risks: {type: array, items: {type: string}}
  - id: implementar
    type: agent
    agent: desarrollador
    dependsOn: [explorar]
    phase: implement
    prompt: |
      Implementa {{workItem.key}}: {{workItem.title}}.

      {{workItem.description}}

      Lo que encontró la exploración: {{stages.explorar.output.summary}}
      Ficheros que seguramente toca: {{stages.explorar.output.files}}
      Riesgos: {{stages.explorar.output.risks}}

      Sigue las convenciones del repositorio, añade o ajusta los tests y confirma los cambios con un commit.
    checks: [tests, diff]
  # Codex (corrección) y Antigravity (seguridad) juzgan a la vez con la rúbrica. Cada hallazgo que
  # bloquea pasa por dos escépticos que intentan refutarlo; lo que sobrevive lo corrige implementar
  # en su sesión, y se vuelve a juzgar (como mucho 2 rondas).
  - id: juzgar
    type: verification
    dependsOn: [implementar]
    phase: review
    judge:
      agents:
        - {agent: calidad, lens: correctness}
        - {agent: seguridad, lens: security}
      rubric:
        - {id: resuelve, text: "Resuelve la tarea tal y como se pidió", weight: 3, required: true}
        - {id: tests, text: "Los tests cubren el cambio y sus casos límite", weight: 2}
        - {id: alcance, text: "No cambia nada que la tarea no pida", weight: 1}
      refute: 2
    fix: implementar
  # Entrega por PR (EN): en un repositorio con la GitHub App sube la rama, abre la PR (con la nota
  # del juez), espera la CI (si falla, la corrige implementar), pide aprobar la fusión y fusiona. En
  # uno local, se omiten.
  - id: pr
    type: github-pr
    dependsOn: [juzgar]
    phase: deliver
    condition: repository.github
  - id: ci
    type: github-check
    dependsOn: [pr]
    phase: deliver
    condition: repository.github
    fix: implementar
  - id: aprobar-fusion
    type: human-approval
    dependsOn: [ci]
    phase: deliver
    condition: repository.github
    action: "Fusionar la PR de {{workItem.key}}: {{workItem.title}}"
    risk: high
  - id: fusionar
    type: github-merge
    dependsOn: [aprobar-fusion]
    phase: deliver
    condition: repository.github

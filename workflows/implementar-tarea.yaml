id: implementar-tarea
name: Implementar una tarea
description: Antigravity explora el repositorio, Claude Code implementa con los tests en verde, Codex y Antigravity revisan a la vez y Claude Code corrige solo si alguno encuentra algo que bloquee.

agents:
  explorador:
    provider: antigravity
    model: ${AGY_RAPIDO}
    permissionMode: plan
    prompt: |
      Antes de implementar {{workItem.key}} ({{workItem.title}}), explora el repositorio y prepara el terreno.

      {{workItem.description}}

      Si existe docs/skynet/mapa-{{project.slug}}.md (el mapa del repositorio que deja «Conocer un repositorio»), léelo primero.
      No cambies nada. Devuelve un resumen de cómo está organizado lo que toca la tarea, los ficheros que habrá que cambiar y los riesgos.
  desarrollador:
    model: ${CLAUDE_GENERAL}
    permissionMode: acceptEdits
    prompt: |
      Implementa {{workItem.key}}: {{workItem.title}}.

      {{workItem.description}}

      Sigue las convenciones del repositorio, añade o ajusta los tests y confirma los cambios con un commit.
  calidad:
    provider: codex
    model: ${CODEX_FUERTE}
    permissionMode: plan
    prompt: |
      Revisa el cambio de {{workItem.key}} ({{workItem.title}}) respecto a la rama por defecto: corrección, tests y casos límite.
      Pon hasBlockingFindings a true solo si hay algo que impida fusionarlo, y explica cada hallazgo con su fichero y línea.
    output:
      type: object
      properties:
        hasBlockingFindings: {type: boolean}
        summary: {type: string}
  seguridad:
    provider: antigravity
    model: ${AGY_FUERTE}
    permissionMode: plan
    prompt: |
      Revisa la seguridad del cambio de {{workItem.key}} ({{workItem.title}}) respecto a la rama por defecto: entradas, secretos, permisos y dependencias.
      Pon hasBlockingFindings a true solo si hay algo que impida fusionarlo, y explica cada hallazgo con su fichero y línea.
    output:
      type: object
      properties:
        hasBlockingFindings: {type: boolean}
        summary: {type: string}

stages:
  - id: explorar
    type: agent
    agent: explorador
    phase: spec
    outputSchema:
      type: object
      properties:
        summary: {type: string}
        files: {type: array, items: {type: string}}
        risks: {type: array, items: {type: string}}
  - id: implementar
    type: agent
    agent: desarrollador
    dependsOn: [explorar]
    phase: implement
    prompt: |
      Implementa {{workItem.key}}: {{workItem.title}}.

      {{workItem.description}}

      Lo que encontró la exploración: {{stages.explorar.output.summary}}
      Ficheros que seguramente toca: {{stages.explorar.output.files}}
      Riesgos: {{stages.explorar.output.risks}}

      Sigue las convenciones del repositorio, añade o ajusta los tests y confirma los cambios con un commit.
    checks: [tests, diff]
  - id: revisar
    type: parallel
    dependsOn: [implementar]
    phase: review
    children:
      - agent: calidad
      - agent: seguridad
  - id: corregir
    type: agent
    agent: desarrollador
    dependsOn: [revisar]
    phase: implement
    condition: revisar.hasBlockingFindings
    prompt: |
      Corrige lo que bloquea en {{workItem.key}} según la revisión, vuelve a pasar los tests y confirma los cambios.

      Calidad (Codex): {{stages.revisar.calidad.output.summary}}

      Seguridad (Antigravity): {{stages.revisar.seguridad.output.summary}}
    checks: [tests, diff]
  # Entrega por PR (EN): en un repositorio con la GitHub App sube la rama, abre la PR, espera la CI
  # (si falla, la corrige implementar), pide aprobar la fusión y fusiona. En uno local, se omiten.
  - id: pr
    type: github-pr
    dependsOn: [revisar, "corregir?"]
    workspaceFrom: revisar
    phase: deliver
    condition: repository.github
  - id: ci
    type: github-check
    dependsOn: [pr]
    phase: deliver
    condition: repository.github
    fix: implementar
  - id: aprobar-fusion
    type: human-approval
    dependsOn: [ci]
    phase: deliver
    condition: repository.github
    action: "Fusionar la PR de {{workItem.key}}: {{workItem.title}}"
    risk: high
  - id: fusionar
    type: github-merge
    dependsOn: [aprobar-fusion]
    phase: deliver
    condition: repository.github

id: revisar-codigo
name: Revisar código
description: Tres revisores a la vez (arquitectura, tests y seguridad) y un informe único con los hallazgos por prioridad. Solo lee y no cambia nada.

inputs:
  foco:
    type: string
    required: false
    description: Qué revisar (una carpeta, un módulo o un tema). Vacío, todo el repositorio.

agents:
  arquitectura:
    description: Revisa la arquitectura y el diseño, sin cambiar nada.
    model: ${CLAUDE_FUERTE}
    fallback:
      provider: codex
      model: ${CODEX_FUERTE}
    permissionMode: plan
    prompt: |
      Revisa la arquitectura y el diseño del repositorio para {{workItem.key}} ({{workItem.title}}). Foco: {{inputs.foco}}.
      Busca acoplamientos, responsabilidades mal repartidas, duplicación y código difícil de cambiar. No cambies nada.
      Devuelve un resumen y los hallazgos, cada uno con su fichero, su gravedad (alta, media o baja) y qué harías.
    output:
      type: object
      properties:
        summary: {type: string}
        findings:
          type: array
          items:
            type: object
            properties:
              file: {type: string}
              severity: {type: string}
              recommendation: {type: string}
  revisor-tests:
    description: Revisa los tests, sin cambiar nada.
    provider: codex
    model: ${CODEX_FUERTE}
    fallback:
      provider: claude-code
      model: ${CLAUDE_FUERTE}
    permissionMode: plan
    prompt: |
      Revisa los tests del repositorio para {{workItem.key}} ({{workItem.title}}). Foco: {{inputs.foco}}.
      Busca lo que no está probado, casos límite que faltan, tests frágiles y errores que los tests no verían. No cambies nada.
      Devuelve un resumen y los hallazgos, cada uno con su fichero, su gravedad (alta, media o baja) y qué harías.
    output:
      type: object
      properties:
        summary: {type: string}
        findings:
          type: array
          items:
            type: object
            properties:
              file: {type: string}
              severity: {type: string}
              recommendation: {type: string}
  seguridad:
    description: Revisa la seguridad, sin cambiar nada.
    provider: antigravity
    model: ${AGY_FUERTE}
    fallback:
      provider: claude-code
      model: ${CLAUDE_FUERTE}
    # Antigravity sin terminal deniega en `plan` hasta `find` o `ls`: con `dontAsk` se salta los
    # permisos, siempre dentro de su sandbox (ver docs/antigravity-stream-json.md).
    permissionMode: dontAsk
    prompt: |
      Revisa la seguridad del repositorio para {{workItem.key}} ({{workItem.title}}). Foco: {{inputs.foco}}.
      Busca entradas sin validar, secretos en el código, permisos, inyecciones y dependencias vulnerables. No cambies nada.
      Devuelve un resumen y los hallazgos, cada uno con su fichero, su gravedad (alta, media o baja) y qué harías.
    output:
      type: object
      properties:
        summary: {type: string}
        findings:
          type: array
          items:
            type: object
            properties:
              file: {type: string}
              severity: {type: string}
              recommendation: {type: string}
  redactor:
    description: Junta las tres revisiones en un informe.
    model: ${CLAUDE_GENERAL}
    fallback:
      provider: codex
      model: ${CODEX_FUERTE}
    permissionMode: plan

stages:
  - id: revisar
    name: Revisan arquitectura, tests y seguridad
    type: parallel
    phase: review
    children:
      - agent: arquitectura
      - {id: tests, agent: revisor-tests}
      - agent: seguridad
  - id: informe
    name: Redacta el informe
    type: agent
    agent: redactor
    dependsOn: [revisar]
    phase: deliver
    prompt: |
      Junta en un solo informe la revisión de {{workItem.key}} ({{workItem.title}}). Foco: {{inputs.foco}}.

      Arquitectura (Claude Code): {{stages.revisar.arquitectura.output.summary}}
      {{stages.revisar.arquitectura.output.findings}}

      Tests (Codex): {{stages.revisar.tests.output.summary}}
      {{stages.revisar.tests.output.findings}}

      Seguridad (Antigravity): {{stages.revisar.seguridad.output.summary}}
      {{stages.revisar.seguridad.output.findings}}

      Quita los duplicados, comprueba en el código los hallazgos dudosos y ordénalos por prioridad: primero lo que hay que arreglar ya. No cambies nada.
      Devuelve un resumen y los hallazgos, cada uno con su título, su fichero, su gravedad (alta, media o baja), qué harías y quién lo vio (arquitectura, tests o seguridad).
    outputSchema:
      type: object
      properties:
        summary: {type: string}
        findings:
          type: array
          items:
            type: object
            properties:
              title: {type: string}
              file: {type: string}
              severity: {type: string}
              recommendation: {type: string}
              source: {type: string}

id: especificar-planificar-implementar
name: Especificar, planificar e implementar
description: Antigravity especifica en openspec/proposal.md, Claude Code planifica, tú apruebas el plan, Claude Code implementa con los tests en verde y Codex lo juzga contra la propuesta aprobada; los escépticos descartan los falsos positivos y Claude Code corrige lo que bloquea de verdad.

agents:
  analista:
    provider: antigravity
    model: ${AGY_FUERTE}
    fallback:
      provider: claude-code
      model: ${CLAUDE_FUERTE}
    permissionMode: acceptEdits
    prompt: |
      Especifica {{workItem.key}}: {{workItem.title}}.

      {{workItem.description}}

      Lee lo que haga falta del repositorio. Escribe la propuesta en openspec/proposal.md con estas cinco secciones (`##`), todas con texto:
      - Qué se podrá hacer: lo que el usuario podrá hacer y antes no.
      - Qué resultado se obtiene: el resultado esperado, con un ejemplo o una referencia.
      - Qué debe respetar: lo que no puede romper.
      - Cómo se demuestra: los tests o los pasos que lo prueban.
      - Fuera de alcance.
      Devuelve un resumen de una o dos frases y los riesgos que veas.
  arquitecto:
    model: ${CLAUDE_FUERTE}
    fallback:
      provider: codex
      model: ${CODEX_FUERTE}
    permissionMode: acceptEdits
    prompt: Planifica {{workItem.key}} a partir de openspec/proposal.md.
  desarrollador:
    model: ${CLAUDE_GENERAL}
    fallback:
      provider: codex
      model: ${CODEX_FUERTE}
    permissionMode: acceptEdits
    prompt: Implementa {{workItem.key}} siguiendo openspec/tasks.md y confirma los cambios con un commit.
  # El juez de `juzgar` (VA-B, VA-C): en solo lectura, con la rúbrica y sin ver lo que dijo el
  # desarrollador. Su reserva nunca es Claude Code, que es quien implementa.
  revisor:
    provider: codex
    model: ${CODEX_FUERTE}
    fallback:
      provider: antigravity
      model: ${AGY_FUERTE}
    prompt: |
      Compáralo con openspec/proposal.md y openspec/tasks.md: que haga lo que dicen, con tests, y sin romper nada.

stages:
  - id: spec
    type: agent
    agent: analista
    phase: spec
    outputSchema:
      type: object
      properties:
        summary: {type: string}
        risks: {type: array, items: {type: string}}
    artifacts: [openspec/proposal.md]
    # ES-A: la propuesta tiene que decir qué se podrá hacer, qué resultado, qué respeta, cómo se
    # demuestra y qué queda fuera. Si no, se repite una vez, y el analista recibe lo que faltaba.
    checks: [spec]
    retry: {maxAttempts: 2, on: [verification]}
  - id: plan
    type: agent
    agent: arquitecto
    dependsOn: [spec]
    phase: plan
    prompt: |
      Planifica {{workItem.key}} a partir de su propuesta (openspec/proposal.md):
      {{stages.spec.output.summary}}

      Riesgos: {{stages.spec.output.risks}}

      Escribe las tareas en openspec/tasks.md, en orden y cada una con cómo se comprueba, y confirma la propuesta y el plan con un commit. No implementes nada todavía.
    outputSchema:
      type: object
      properties:
        summary: {type: string}
    artifacts: [openspec/tasks.md]
  - id: aprobar-plan
    type: human-approval
    dependsOn: [plan]
    action: "Aprobar el plan de {{workItem.key}} (openspec/tasks.md): {{stages.plan.output.summary}}"
    risk: medium
    revise: plan
  - id: implementar
    type: agent
    agent: desarrollador
    dependsOn: [aprobar-plan]
    phase: implement
    checks: [tests, diff]
  # Codex juzga la implementación con la rúbrica, que incluye respetar la propuesta aprobada. Cada
  # hallazgo que bloquea pasa por dos escépticos; lo que sobrevive lo corrige implementar en su
  # sesión, y se vuelve a juzgar (como mucho 2 rondas).
  - id: juzgar
    type: verification
    dependsOn: [implementar]
    phase: review
    judge:
      agents:
        - {agent: revisor, lens: completeness}
      rubric:
        - {id: propuesta, text: "Respeta la propuesta aprobada (openspec/proposal.md) y su plan", weight: 3, required: true}
        - {id: resuelve, text: "Resuelve la tarea tal y como se pidió", weight: 2, required: true}
        - {id: tests, text: "Los tests cubren el cambio y sus casos límite", weight: 2}
        - {id: alcance, text: "No cambia nada que la propuesta deje fuera", weight: 1}
        - {id: demuestra, text: "Cumple lo que dice «Cómo se demuestra» de la propuesta", weight: 2}
      refute: 2
      # AU-C: un cambio de solo documentación pasa sin juez; los escépticos, solo en el nivel 2.
      minRisk: 1
      refuteMinRisk: 2
    fix: implementar
  # Entrega por PR (EN): en un repositorio con la GitHub App sube la rama, abre la PR, espera la CI
  # (si falla, la corrige implementar), pide aprobar la fusión y fusiona. En uno local, se omiten.
  - id: pr
    type: github-pr
    dependsOn: [juzgar]
    phase: deliver
    condition: repository.github
  - id: ci
    type: github-check
    dependsOn: [pr]
    phase: deliver
    condition: repository.github
    fix: implementar
  - id: aprobar-fusion
    type: human-approval
    dependsOn: [ci]
    phase: deliver
    condition: repository.github
    action: "Fusionar la PR de {{workItem.key}}: {{workItem.title}}"
    risk: high
    # AU-C: se aprueba sola si el repositorio lo permite y el cambio es de riesgo 0-1, de 400
    # líneas como mucho, con la CI en verde y juzgado.
    autoApprove: {maxRisk: 1, maxLines: 400}
  - id: fusionar
    type: github-merge
    dependsOn: [aprobar-fusion]
    phase: deliver
    condition: repository.github

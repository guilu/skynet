spring:
  application:
    name: skynet-control-plane
  datasource:
    url: ${SKYNET_DB_URL:jdbc:postgresql://localhost:5432/skynet}
    username: ${SKYNET_DB_USER:skynet}
    password: ${SKYNET_DB_PASSWORD:skynet}
  flyway:
    locations: classpath:db/migration

server:
  port: ${SKYNET_PORT:8080}
  servlet:
    session:
      # Una sesión de la web caduca tras este tiempo sin peticiones.
      timeout: ${SKYNET_SESSION_TIMEOUT:12h}
      cookie:
        http-only: true
        same-site: lax
        secure: ${SKYNET_SECURE_COOKIES:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info

skynet:
  security:
    # Usuario único de la web y la API. Sin contraseña, se genera una en cada arranque y se guarda
    # en generated-password-file (solo legible por el usuario del proceso; el log dice dónde).
    username: ${SKYNET_ADMIN_USER:admin}
    password: ${SKYNET_ADMIN_PASSWORD:}
    # true: no arranca sin contraseña en vez de generar una (lo usa Docker Compose).
    require-password: ${SKYNET_REQUIRE_ADMIN_PASSWORD:false}
    # Orígenes, separados por comas, que pueden llamar a la API desde otro dominio.
    cors-origins: ${SKYNET_CORS_ORIGINS:}
    generated-password-file: ${SKYNET_ADMIN_PASSWORD_FILE:data/admin-password}
    # Fallos seguidos (login, HTTP Basic o registro del runner) desde un mismo origen tras los
    # que se bloquea durante `lockout` (429 con Retry-After).
    max-failed-attempts: ${SKYNET_MAX_FAILED_ATTEMPTS:10}
    lockout: ${SKYNET_LOCKOUT:5m}
  runner:
    # Secreto para registrar runners. Sin él, el registro está desactivado.
    registration-token: ${SKYNET_RUNNER_REGISTRATION_TOKEN:}
    # Lo más que ocupa una petición JSON del runner (registro, latido, lote de eventos).
    max-request: ${SKYNET_RUNNER_MAX_REQUEST:32MB}
  monitoring:
    # Tiempo sin actividad tras el que un agente activo pasa a UNRESPONSIVE.
    unresponsive-after: ${SKYNET_UNRESPONSIVE_AFTER:5m}
    # Tiempo que se espera a que el runner confirme una cancelación antes de dar el agente por
    # terminado (el runner caído o sin responder).
    cancel-timeout: ${SKYNET_CANCEL_TIMEOUT:70s}
  workspaces:
    # Tiempo desde que termina lo último que trabajó en un worktree hasta que se elimina en su
    # runner. La rama se conserva.
    retention: ${SKYNET_WORKTREE_RETENTION:7d}
    # Cada cuánto se buscan worktrees que han pasado la retención.
    check-interval: ${SKYNET_WORKTREE_CHECK_INTERVAL:1h}
  engine:
    # Evaluaciones del motor de workflows a la vez en este control plane.
    workers: ${SKYNET_ENGINE_WORKERS:2}
    # Cada cuánto se buscan ejecuciones pendientes de evaluar (tras un fallo o un reinicio).
    poll-interval: ${SKYNET_ENGINE_POLL_INTERVAL:1s}
    # Tiempo que un worker se queda una ejecución; si cae, otro la retoma al vencer.
    lease: ${SKYNET_ENGINE_LEASE:2m}
    # Espera antes de reintentar una evaluación que falló o tuvo que esperar a su worktree.
    retry-delay: ${SKYNET_ENGINE_RETRY_DELAY:5s}
  verification:
    # Tiempo máximo del comando de validación de un repositorio.
    timeout: ${SKYNET_VERIFICATION_TIMEOUT:30m}
  memory:
    # Lo más que ocupa el contexto de memoria que recibe un agente al empezar (mem_context).
    context-max-chars: ${SKYNET_MEMORY_CONTEXT_MAX_CHARS:4000}
    # Límites de cada invocación: llamadas a las herramientas de memoria y guardados.
    max-calls: ${SKYNET_MEMORY_MAX_CALLS:500}
    max-saves: ${SKYNET_MEMORY_MAX_SAVES:100}
  github:
    # La GitHub App de esta instalación (hito GH, ver docs/github.md). Sin las tres primeras,
    # Skynet no habla con GitHub.
    app-id: ${SKYNET_GITHUB_APP_ID:}
    # Ruta al .pem que da GitHub al crear la App. Nunca se copia a la base de datos.
    private-key-file: ${SKYNET_GITHUB_PRIVATE_KEY_FILE:}
    webhook-secret: ${SKYNET_GITHUB_WEBHOOK_SECRET:}
    # La API de GitHub; para GitHub Enterprise, https://<host>/api/v3.
    api-url: ${SKYNET_GITHUB_API_URL:https://api.github.com}
    # La web de ese GitHub, la de las URL remotas; sin ella, github.com o el host de la API.
    web-url: ${SKYNET_GITHUB_WEB_URL:}
    # De dónde cuelgan los repositorios al subir una rama (EN): por defecto, web-url. Las E2E lo
    # apuntan a remotos locales para no subir nada a GitHub.
    git-url: ${SKYNET_GITHUB_GIT_URL:}
    webhooks:
      # Cada cuánto se procesan las entregas pendientes y cuánto se queda un worker una entrega.
      poll-interval: ${SKYNET_GITHUB_WEBHOOK_POLL_INTERVAL:1s}
      lease: 2m
      # Una entrega que falla se reintenta con esta espera, doblada en cada intento, hasta
      # max-attempts; después queda FAILED.
      retry-delay: 5s
      max-attempts: 5
      # Tiempo que se guardan las entregas.
      retention: ${SKYNET_GITHUB_WEBHOOK_RETENTION:30d}
      # Cada cuánto se piden a GitHub las entregas que no llegaron (túnel o equipo caídos).
      redelivery-interval: ${SKYNET_GITHUB_REDELIVERY_INTERVAL:10m}
      max-payload: 25MB
    ci:
      # Cada cuánto se miran las esperas de CI a las que les toca preguntar (EN-B).
      poll-interval: ${SKYNET_GITHUB_CI_POLL_INTERVAL:2s}
      # Si no llega ningún webhook, cada cuánto se pregunta igual por la CI de un commit.
      recheck: ${SKYNET_GITHUB_CI_RECHECK:2m}
      # Sin ningún check en este tiempo, el repositorio no tiene CI (ifNoChecks decide).
      no-checks-after: ${SKYNET_GITHUB_CI_NO_CHECKS_AFTER:5m}
    pull-requests:
      # Cada cuánto se abren las PR cuya rama ya está subida (EN-A).
      poll-interval: ${SKYNET_GITHUB_PR_POLL_INTERVAL:2s}
      # La URL con la que se ve Skynet, para enlazar la ejecución desde la PR. Vacía: sin enlace,
      # porque Skynet vive en tu equipo y GitHub no llega a él.
      public-url: ${SKYNET_PUBLIC_URL:}
  artifacts:
    # Directorio donde se guarda el contenido de los artefactos.
    root: ${SKYNET_ARTIFACTS_DIR:data/artifacts}
    # Tamaño máximo de un artefacto; lo que pase se recorta con una marca visible.
    max-size: ${SKYNET_ARTIFACT_MAX_SIZE:20MB}
    # Lo más que se acepta en una subida del runner, antes de redactar y recortar.
    max-upload: ${SKYNET_ARTIFACT_MAX_UPLOAD:64MB}

server {
  # Puerto sin privilegios: la imagen corre como el usuario nginx, no como root.
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  # Sin la versión de nginx en las cabeceras ni en las páginas de error.
  server_tokens off;

  # Cabeceras de seguridad, también en las respuestas de error y de la API (`always`). La CSP solo
  # admite lo del propio origen: scripts y workers del bundle, estilos en línea (la paleta y Monaco
  # los inyectan), imágenes y fuentes `data:` (favicon con la paleta, iconos de Monaco).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  # API y streaming (SSE): sin buffering para que los eventos lleguen en tiempo real.
  location ~ ^/(api|actuator)/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_read_timeout 1h;
    # Subidas de artefactos del runner cuando se conecta a través de la web (SKYNET_ARTIFACT_MAX_UPLOAD).
    client_max_body_size 64m;
  }

  # SPA: cualquier otra ruta sirve index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}

# Solo los webhooks de GitHub (SKYNET_WEBHOOK_PORT), para abrir a internet este puerto y no el
# resto: el login, la web y la API se quedan en el de arriba. Ver docs/github.md.
server {
  listen 8082;
  server_name _;
  server_tokens off;

  location = /api/github/webhooks {
    limit_except POST {
      deny all;
    }
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # GitHub no manda entregas de más de 25 MB.
    client_max_body_size 25m;
  }

  location / {
    return 404;
  }
}

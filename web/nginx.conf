server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # API y streaming (SSE): sin buffering para que los eventos lleguen en tiempo real.
  location ~ ^/(api|actuator)/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_read_timeout 1h;
    # Subidas de artefactos del runner cuando se conecta a través de la web (SKYNET_ARTIFACT_MAX_UPLOAD).
    client_max_body_size 64m;
  }

  # SPA: cualquier otra ruta sirve index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}

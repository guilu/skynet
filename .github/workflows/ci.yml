name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java (Gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      # spotlessCheck forma parte de `check`; los tests con Testcontainers usan el Docker del runner.
      - run: ./gradlew build
      # reset-local.sh con Docker y systemctl simulados: no borra nada fuera de una carpeta temporal.
      - name: Pruebas de scripts/reset-local.sh
        run: scripts/tests/reset-local.test.sh
      # Qué E2E lanza cada PR (.github/workflows/e2e.yml).
      - name: Pruebas de scripts/ci/e2e-alcance.sh
        run: scripts/tests/e2e-alcance.test.sh
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: '**/build/reports/tests/'

  web:
    name: Web (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  compose:
    name: Docker Compose (app)
    runs-on: ubuntu-latest
    env:
      SKYNET_ADMIN_PASSWORD: ci-admin
      SKYNET_RUNNER_REGISTRATION_TOKEN: ci-runner
      SKYNET_DB_PASSWORD: ci-db
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build y arranque de la aplicación completa
        run: docker compose -f deploy/docker-compose.yml --profile app up -d --build --wait --wait-timeout 300
      - name: La web sirve el frontend y redirige la API, que exige usuario
        run: |
          curl -fsS http://localhost:8081/ | grep -q '<title>Skynet</title>'
          curl -fsS http://localhost:8081/actuator/health | grep -q '"status":"UP"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/api/projects)" = 401
          curl -fsS -u admin:$SKYNET_ADMIN_PASSWORD http://localhost:8081/api/projects
      - name: nginx corre sin privilegios y manda las cabeceras de seguridad
        run: |
          test "$(docker compose -f deploy/docker-compose.yml --profile app exec -T web id -u)" != 0
          headers=$(curl -fsSI http://localhost:8081/)
          for h in 'content-security-policy: default-src' 'x-content-type-options: nosniff' \
                   'x-frame-options: deny' 'referrer-policy: no-referrer'; do
            grep -qi "^$h" <<< "$headers" || { echo "Falta la cabecera: $h"; exit 1; }
          done
          ! grep -qi '^server: nginx/' <<< "$headers"
      - name: La API no arranca sin la contraseña de PostgreSQL
        run: |
          out=$(docker compose -f deploy/docker-compose.yml --profile app run --rm --no-deps \
            -e SKYNET_DB_PASSWORD= api 2>&1) && { echo "La API arrancó sin SKYNET_DB_PASSWORD"; exit 1; }
          grep -q 'Define SKYNET_DB_PASSWORD' <<< "$out"
      - name: Un runner en el host se registra por la web y completa un agente (fake-claude)
        run: scripts/compose-smoke.sh
      - if: failure()
        run: docker compose -f deploy/docker-compose.yml --profile app logs
      - if: failure()
        run: cat build/compose-smoke/runner.log || true
      - if: always()
        run: docker compose -f deploy/docker-compose.yml --profile app down -v

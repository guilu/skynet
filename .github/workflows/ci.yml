name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java (Gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      # spotlessCheck forma parte de `check`; los tests con Testcontainers usan el Docker del runner.
      - run: ./gradlew build
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: '**/build/reports/tests/'

  web:
    name: Web (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: skynet
          POSTGRES_PASSWORD: skynet
          POSTGRES_DB: skynet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skynet" --health-interval 5s --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      # Control plane + runner con fake-claude + vite preview + Playwright.
      - run: ./scripts/e2e.sh
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            web/playwright-report/
            web/test-results/
            build/e2e/*.log

  compose:
    name: Docker Compose (app)
    runs-on: ubuntu-latest
    env:
      SKYNET_ADMIN_PASSWORD: ci-admin
    steps:
      - uses: actions/checkout@v5
      - name: Build y arranque de la aplicación completa
        run: docker compose -f deploy/docker-compose.yml --profile app up -d --build --wait --wait-timeout 300
      - name: La web sirve el frontend y redirige la API, que exige usuario
        run: |
          curl -fsS http://localhost:8081/ | grep -q '<title>Skynet</title>'
          curl -fsS http://localhost:8081/actuator/health | grep -q '"status":"UP"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/api/projects)" = 401
          curl -fsS -u admin:$SKYNET_ADMIN_PASSWORD http://localhost:8081/api/projects
      - if: failure()
        run: docker compose -f deploy/docker-compose.yml --profile app logs
      - if: always()
        run: docker compose -f deploy/docker-compose.yml --profile app down -v

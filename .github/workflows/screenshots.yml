name: Galería visual

# Genera la galería de capturas (VS-A) bajo demanda: Actions → Galería visual → Run workflow.
# Siembra datos de demostración en una base de datos de usar y tirar, captura todas las pantallas,
# escanea la privacidad y sube docs/screenshots como artifact. No hace commit ni push.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  galeria:
    name: Generar la galería
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          # Una base solo para las capturas: scripts/screenshots.sh se niega a usar una llamada `skynet`.
          POSTGRES_USER: skynet
          POSTGRES_PASSWORD: skynet
          POSTGRES_DB: skynet_screenshots
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skynet" --health-interval 5s --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Capturas, privacidad, índice y ZIP
        run: npm run screenshots
        working-directory: web
        env:
          SCREENSHOTS_DB_URL: jdbc:postgresql://127.0.0.1:5432/skynet_screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: skynet-screenshots
          path: docs/screenshots/
          retention-days: 14
          if-no-files-found: error

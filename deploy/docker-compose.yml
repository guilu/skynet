# Desarrollo y despliegue local de Skynet.
#
#   Solo PostgreSQL (API y web en local):  docker compose -f deploy/docker-compose.yml up -d
#   Aplicación completa:                   cp deploy/.env.example deploy/.env   # y rellénalo
#                                          docker compose -f deploy/docker-compose.yml --profile app up -d --build --wait
#
# Variables: deploy/.env.example. SKYNET_ADMIN_PASSWORD es obligatoria con el perfil app (la API no
# arranca sin ella) y SKYNET_RUNNER_REGISTRATION_TOKEN hace falta para registrar runners.
#
# El runner no va en contenedor: se ejecuta en el host porque necesita `claude` y los repositorios
# (README, «Instalar el runner»).
name: skynet

# Logs de los contenedores con rotación: como mucho 5 × 10 MB por servicio.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: skynet
      POSTGRES_USER: ${SKYNET_DB_USER:-skynet}
      POSTGRES_PASSWORD: ${SKYNET_DB_PASSWORD:-skynet}
    # Solo en este equipo: la base de datos no se publica en la red.
    ports:
      - "${SKYNET_DB_BIND:-127.0.0.1}:${SKYNET_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d skynet"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging: *logging
    restart: unless-stopped

  api:
    profiles: [app]
    build:
      context: ..
      dockerfile: control-plane/Dockerfile
    environment:
      SKYNET_DB_URL: jdbc:postgresql://postgres:5432/skynet
      SKYNET_DB_USER: ${SKYNET_DB_USER:-skynet}
      SKYNET_DB_PASSWORD: ${SKYNET_DB_PASSWORD:-skynet}
      # Secreto para registrar runners; vacío desactiva el registro.
      SKYNET_RUNNER_REGISTRATION_TOKEN: ${SKYNET_RUNNER_REGISTRATION_TOKEN:-}
      SKYNET_ARTIFACTS_DIR: /data/artifacts
      # Usuario de la web. Sin SKYNET_ADMIN_PASSWORD la API no arranca.
      SKYNET_ADMIN_USER: ${SKYNET_ADMIN_USER:-admin}
      SKYNET_ADMIN_PASSWORD: ${SKYNET_ADMIN_PASSWORD:-}
      SKYNET_REQUIRE_ADMIN_PASSWORD: "true"
      # Solo detrás de HTTPS: la cookie de sesión viaja únicamente cifrada.
      SKYNET_SECURE_COOKIES: ${SKYNET_SECURE_COOKIES:-false}
      SKYNET_SESSION_TIMEOUT: ${SKYNET_SESSION_TIMEOUT:-12h}
      SKYNET_CORS_ORIGINS: ${SKYNET_CORS_ORIGINS:-}
      # Worktrees sin uso que se eliminan solos, y tiempo máximo del comando de verificación.
      SKYNET_WORKTREE_RETENTION: ${SKYNET_WORKTREE_RETENTION:-7d}
      SKYNET_VERIFICATION_TIMEOUT: ${SKYNET_VERIFICATION_TIMEOUT:-30m}
    volumes:
      - artifacts-data:/data/artifacts
    # Los runners se conectan aquí o a la web, que redirige /api. El healthcheck es el de la imagen.
    ports:
      - "${SKYNET_API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    # Tiempo para cerrar los streams en vivo y las peticiones en curso al parar.
    stop_grace_period: 30s
    logging: *logging
    restart: unless-stopped

  web:
    profiles: [app]
    build:
      context: ../web
    ports:
      - "${SKYNET_WEB_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_healthy
    logging: *logging
    restart: unless-stopped

# Datos persistentes: `down` los conserva, `down -v` los borra.
volumes:
  postgres-data:
  artifacts-data:

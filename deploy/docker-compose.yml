# Entorno de desarrollo: PostgreSQL para el control plane.
# Uso: docker compose -f deploy/docker-compose.yml up -d
# La API y la web se ejecutan en local (./gradlew :control-plane:bootRun y npm run dev).
name: skynet

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: skynet
      POSTGRES_USER: skynet
      POSTGRES_PASSWORD: skynet
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skynet -d skynet"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
